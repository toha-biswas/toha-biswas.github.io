<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MD ABUTOHA BISWAS | Portfolio</title>

  <!-- Google Fonts: Inter & Instrument Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (for JSX in-browser execution) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Framer Motion -->
  <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>

  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- HLS.js for Streaming Video -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: "hsl(var(--bg) / <alpha-value>)",
            surface: "hsl(var(--surface) / <alpha-value>)",
            "text-primary": "hsl(var(--text) / <alpha-value>)",
            muted: "hsl(var(--muted) / <alpha-value>)",
            stroke: "hsl(var(--stroke) / <alpha-value>)",
          },
          fontFamily: {
            body: ["var(--font-body)", "sans-serif"],
            display: ["var(--font-display)", "serif"],
          },
        },
      },
    };
  </script>

  <!-- Custom Styles & Animations -->
  <style>
    :root {
      --font-body: 'Inter', sans-serif;
      --font-display: 'Instrument Serif', serif;

      --bg: 0 0% 4%;
      --surface: 0 0% 8%;
      --text: 0 0% 96%;
      --muted: 0 0% 53%;
      --stroke: 0 0% 12%;
      --accent: 0 0% 96%;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: hsl(var(--bg));
      color: hsl(var(--text));
      font-family: var(--font-body);
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* Gradients & Borders */
    .accent-gradient {
      background: linear-gradient(90deg, #89AACC 0%, #4E85BF 100%);
    }

    .accent-gradient-border {
      position: relative;
    }

    .accent-gradient-border::before {
      content: '';
      position: absolute;
      inset: -1.5px;
      background: linear-gradient(90deg, #89AACC 0%, #4E85BF 100%);
      background-size: 200% 200%;
      border-radius: inherit;
      z-index: -1;
      animation: gradient-shift 6s ease infinite;
    }

    /* Animations */
    @keyframes scroll-down {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(200%); }
    }

    .animate-scroll-down {
      animation: scroll-down 1.5s ease-in-out infinite;
    }

    @keyframes role-fade-in {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .animate-role-fade-in {
      animation: role-fade-in 0.4s ease-out forwards;
    }

    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .halftone-overlay {
      background-image: radial-gradient(circle, #000 1px, transparent 1px);
      background-size: 4px 4px;
    }

    .text-stroke-title {
      -webkit-text-stroke: 1px hsl(var(--stroke));
      color: transparent;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { motion, AnimatePresence } = window.Motion;

    gsap.registerPlugin(ScrollTrigger);

    const VIDEO_URL = "https://stream.mux.com/Aa02T7oM1wH5Mk5EEVDYhbZ1ChcdhRsS2m1NYyx4Ua1g.m3u8";
    const ROLES = ["Data Analyst", "BCA Scholar", "Cyber Security Explorer", "C Programmer"];
    const LOADING_WORDS = ["Analyze", "Structure", "Secure"];

    /* ----------------- Sub-Component: HLS Video Background ----------------- */
    const HlsVideo = ({ src, flipped = false }) => {
      const videoRef = useRef(null);

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        let hls = null;
        if (window.Hls && window.Hls.isSupported()) {
          hls = new window.Hls({ autoStartLoad: true });
          hls.loadSource(src);
          hls.attachMedia(video);
          hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(() => {});
          });
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = src;
          video.addEventListener("loadedmetadata", () => {
            video.play().catch(() => {});
          });
        }

        return () => {
          if (hls) hls.destroy();
        };
      }, [src]);

      return (
        <video
          ref={videoRef}
          autoPlay
          muted
          loop
          playsInline
          className={`absolute top-1/2 left-1/2 min-w-full min-h-full object-cover -translate-x-1/2 -translate-y-1/2 pointer-events-none ${
            flipped ? "scale-y-[-1]" : ""
          }`}
        />
      );
    };

    /* ----------------- Sub-Component: Loading Screen ----------------- */
    const LoadingScreen = ({ onComplete }) => {
      const [count, setCount] = useState(0);
      const [wordIdx, setWordIdx] = useState(0);

      useEffect(() => {
        let startTimestamp = null;
        const duration = 2700;

        const step = (timestamp) => {
          if (!startTimestamp) startTimestamp = timestamp;
          const progress = Math.min((timestamp - startTimestamp) / duration, 1);
          setCount(Math.floor(progress * 100));

          if (progress < 1) {
            requestAnimationFrame(step);
          } else {
            setTimeout(onComplete, 400);
          }
        };

        requestAnimationFrame(step);

        const wordInterval = setInterval(() => {
          setWordIdx((prev) => (prev + 1) % LOADING_WORDS.length);
        }, 900);

        return () => clearInterval(wordInterval);
      }, [onComplete]);

      return (
        <motion.div
          exit={{ opacity: 0, y: -20 }}
          transition={{ duration: 0.8, ease: [0.76, 0, 0.24, 1] }}
          className="fixed inset-0 z-[9999] bg-bg flex flex-col justify-between p-8 md:p-14 select-none pointer-events-none"
        >
          <motion.div
            initial={{ y: -20, opacity: 0 }}
            animate={{ y: 0, opacity: 1 }}
            transition={{ duration: 0.6 }}
            className="text-xs text-muted uppercase tracking-[0.3em]"
          >
            MD ABUTOHA BISWAS · PORTFOLIO
          </motion.div>

          <div className="absolute inset-0 flex items-center justify-center">
            <AnimatePresence mode="wait">
              <motion.span
                key={LOADING_WORDS[wordIdx]}
                initial={{ y: 20, opacity: 0 }}
                animate={{ y: 0, opacity: 0.8 }}
                exit={{ y: -20, opacity: 0 }}
                transition={{ duration: 0.4 }}
                className="text-4xl md:text-6xl lg:text-7xl font-display italic text-text-primary/80"
              >
                {LOADING_WORDS[wordIdx]}
              </motion.span>
            </AnimatePresence>
          </div>

          <div className="flex flex-col items-end gap-6 w-full">
            <div className="text-6xl md:text-8xl lg:text-9xl font-display text-text-primary tabular-nums">
              {String(count).padStart(3, "0")}
            </div>

            <div className="w-full h-[3px] bg-stroke/50 relative overflow-hidden">
              <div
                className="accent-gradient h-full origin-left transition-transform duration-75"
                style={{
                  transform: `scaleX(${count / 100})`,
                  boxShadow: "0 0 8px rgba(137, 170, 204, 0.35)",
                }}
              />
            </div>
          </div>
        </motion.div>
      );
    };

    /* ----------------- Sub-Component: Parallax Gallery ----------------- */
    const Explorations = () => {
      const containerRef = useRef(null);
      const pinnedRef = useRef(null);
      const colLeftRef = useRef(null);
      const colRightRef = useRef(null);

      const gallery = [
        { id: 1, title: "Spreadsheet Analytics", img: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=800&q=80", rot: "-6deg" },
        { id: 2, title: "Cybersecurity Terminals", img: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=800&q=80", rot: "8deg" },
        { id: 3, title: "Algorithmic Logic", img: "https://images.unsplash.com/photo-1515879218367-8466d910aaa4?w=800&q=80", rot: "-4deg" },
        { id: 4, title: "Relational Structures", img: "https://images.unsplash.com/photo-1544383835-bda2bc66a55d?w=800&q=80", rot: "5deg" },
        { id: 5, title: "System Diagnostics", img: "https://images.unsplash.com/photo-1504639725590-34d0984388bd?w=800&q=80", rot: "-7deg" },
        { id: 6, title: "Web Interfaces", img: "https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?w=800&q=80", rot: "6deg" },
      ];

      useEffect(() => {
        const ctx = gsap.context(() => {
          ScrollTrigger.create({
            trigger: containerRef.current,
            start: "top top",
            end: "bottom bottom",
            pin: pinnedRef.current,
            pinSpacing: false,
          });

          if (colLeftRef.current && colRightRef.current) {
            gsap.fromTo(
              colLeftRef.current,
              { y: 120 },
              {
                y: -240,
                ease: "none",
                scrollTrigger: {
                  trigger: containerRef.current,
                  start: "top bottom",
                  end: "bottom top",
                  scrub: 1.2,
                },
              }
            );

            gsap.fromTo(
              colRightRef.current,
              { y: -80 },
              {
                y: 200,
                ease: "none",
                scrollTrigger: {
                  trigger: containerRef.current,
                  start: "top bottom",
                  end: "bottom top",
                  scrub: 0.8,
                },
              }
            );
          }
        }, containerRef);

        return () => ctx.revert();
      }, []);

      return (
        <section ref={containerRef} className="relative min-h-[260vh] bg-bg overflow-hidden">
          <div
            ref={pinnedRef}
            className="h-screen w-full flex flex-col justify-center items-center text-center px-6 z-10 pointer-events-none"
          >
            <div className="pointer-events-auto flex flex-col items-center">
              <span className="text-xs text-muted uppercase tracking-[0.3em] mb-4">
                Explorations
              </span>
              <h2 className="text-4xl md:text-6xl font-normal tracking-tight mb-4">
                Visual <span className="font-display italic">playground</span>
              </h2>
              <p className="text-muted text-sm md:text-base max-w-sm mb-8">
                Data workflows, command-line scripts, security fundamentals, and dashboard mockups.
              </p>
              <a
                href="https://github.com"
                target="_blank"
                rel="noreferrer"
                className="group relative inline-flex items-center rounded-full p-[1.5px] text-xs uppercase tracking-widest"
              >
                <span className="absolute inset-0 bg-gradient-to-r from-[#89AACC] to-[#4E85BF] rounded-full opacity-60 group-hover:opacity-100 transition-opacity" />
                <span className="relative bg-surface px-6 py-2.5 rounded-full text-text-primary">
                  View Repositories ↗
                </span>
              </a>
            </div>
          </div>

          <div className="absolute inset-0 max-w-[1400px] mx-auto px-6 md:px-12 pointer-events-none z-20 flex justify-between">
            <div ref={colLeftRef} className="w-[45%] md:w-[320px] flex flex-col gap-28 pt-40">
              {gallery.slice(0, 3).map((item) => (
                <div
                  key={item.id}
                  className="pointer-events-auto aspect-square rounded-2xl overflow-hidden border border-stroke bg-surface shadow-2xl transition-transform duration-500 hover:scale-105 group relative"
                  style={{ transform: `rotate(${item.rot})` }}
                >
                  <img src={item.img} alt={item.title} className="w-full h-full object-cover" />
                  <div className="absolute inset-0 bg-gradient-to-t from-bg/90 via-transparent to-transparent flex items-end p-4">
                    <span className="text-xs font-mono text-text-primary tracking-wide">{item.title}</span>
                  </div>
                </div>
              ))}
            </div>

            <div ref={colRightRef} className="w-[45%] md:w-[320px] flex flex-col gap-28 pt-80">
              {gallery.slice(3, 6).map((item) => (
                <div
                  key={item.id}
                  className="pointer-events-auto aspect-square rounded-2xl overflow-hidden border border-stroke bg-surface shadow-2xl transition-transform duration-500 hover:scale-105 group relative"
                  style={{ transform: `rotate(${item.rot})` }}
                >
                  <img src={item.img} alt={item.title} className="w-full h-full object-cover" />
                  <div className="absolute inset-0 bg-gradient-to-t from-bg/90 via-transparent to-transparent flex items-end p-4">
                    <span className="text-xs font-mono text-text-primary tracking-wide">{item.title}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    /* ----------------- Main Landing App ----------------- */
    function App() {
      const [isLoading, setIsLoading] = useState(true);
      const [roleIndex, setRoleIndex] = useState(0);
      const [scrolled, setScrolled] = useState(false);
      const [activeNav, setActiveNav] = useState("Home");

      const heroRef = useRef(null);
      const marqueeRef = useRef(null);

      useEffect(() => {
        const timer = setInterval(() => {
          setRoleIndex((prev) => (prev + 1) % ROLES.length);
        }, 2000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 100);
        window.addEventListener("scroll", handleScroll);
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);

      useEffect(() => {
        if (isLoading) return;

        const ctx = gsap.context(() => {
          const tl = gsap.timeline({ defaults: { ease: "power3.out" } });

          tl.fromTo(
            ".name-reveal",
            { opacity: 0, y: 50 },
            { opacity: 1, y: 0, duration: 1.2, delay: 0.1 }
          ).fromTo(
            ".blur-in",
            { opacity: 0, filter: "blur(10px)", y: 20 },
            { opacity: 1, filter: "blur(0px)", y: 0, duration: 1, stagger: 0.1 },
            "-=0.9"
          );

          if (marqueeRef.current) {
            gsap.to(marqueeRef.current, {
              xPercent: -50,
              duration: 35,
              ease: "none",
              repeat: -1,
            });
          }
        }, heroRef);

        return () => ctx.revert();
      }, [isLoading]);

      const scrollTo = (id) => {
        setActiveNav(id);
        document.getElementById(id.toLowerCase())?.scrollIntoView({ behavior: "smooth" });
      };

      const skillsList = [
        "Microsoft Excel",
        "C Programming",
        "HTML & CSS",
        "Data Analysis",
        "Data Cleaning",
        "Cybersecurity Basics",
        "Problem Solving",
        "Git & GitHub",
        "JavaScript"
      ];

      return (
        <div className="relative bg-bg text-text-primary selection:bg-[#89AACC]/20 selection:text-text-primary">
          <AnimatePresence>
            {isLoading && <LoadingScreen onComplete={() => setIsLoading(false)} />}
          </AnimatePresence>

          {/* Floating Navbar */}
          <header className="fixed top-0 left-0 right-0 z-50 flex justify-center pt-4 md:pt-6 px-4 pointer-events-none">
            <nav
              className={`pointer-events-auto inline-flex items-center rounded-full backdrop-blur-md border border-white/10 bg-surface/90 px-2 py-2 transition-all duration-300 ${
                scrolled ? "shadow-lg shadow-black/50 border-stroke" : ""
              }`}
            >
              <a
                href="#home"
                className="group relative flex items-center justify-center w-9 h-9 rounded-full bg-gradient-to-r from-[#89AACC] to-[#4E85BF] p-[1.5px] transition-transform duration-300 hover:scale-110"
              >
                <span className="w-full h-full bg-bg rounded-full flex items-center justify-center font-display italic text-[13px] text-text-primary">
                  AB
                </span>
              </a>

              <div className="w-px h-5 bg-stroke mx-2 hidden sm:block" />

              <div className="flex items-center gap-1">
                {["Home", "About", "Projects", "Skills", "Thoughts"].map((item) => (
                  <button
                    key={item}
                    onClick={() => scrollTo(item)}
                    className={`text-xs sm:text-sm rounded-full px-3 sm:px-4 py-1.5 sm:py-2 transition-colors duration-200 ${
                      activeNav === item
                        ? "text-text-primary bg-stroke/50"
                        : "text-muted hover:text-text-primary hover:bg-stroke/50"
                    }`}
                  >
                    {item}
                  </button>
                ))}
              </div>

              <div className="w-px h-5 bg-stroke mx-2" />

              <a
                href="#contact"
                className="group relative inline-flex items-center justify-center rounded-full p-[1.5px] overflow-hidden text-xs sm:text-sm"
              >
                <span className="absolute inset-[-2px] bg-gradient-to-r from-[#89AACC] to-[#4E85BF] opacity-0 group-hover:opacity-100 transition-opacity duration-300 rounded-full" />
                <span className="relative z-10 flex items-center gap-1 bg-surface px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-text-primary">
                  Say hi <span className="transition-transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5">↗</span>
                </span>
              </a>
            </nav>
          </header>

          {/* Hero Section */}
          <section
            id="home"
            ref={heroRef}
            className="relative h-screen w-full flex flex-col items-center justify-center overflow-hidden"
          >
            <HlsVideo src={VIDEO_URL} />
            <div className="absolute inset-0 bg-black/30 pointer-events-none" />
            <div className="absolute bottom-0 left-0 right-0 h-48 bg-gradient-to-t from-bg to-transparent pointer-events-none" />

            <div className="relative z-10 flex flex-col items-center text-center px-4 max-w-4xl mx-auto mt-12">
              <div className="blur-in text-xs text-muted uppercase tracking-[0.3em] mb-6">
                BCA · DATA SCIENCE &amp; CYBERSECURITY '26
              </div>

              <h1 className="name-reveal text-5xl sm:text-7xl md:text-8xl lg:text-9xl font-display italic leading-[0.92] tracking-tight text-text-primary mb-6">
                MD ABUTOHA BISWAS
              </h1>

              <div className="blur-in text-lg md:text-xl font-light text-muted mb-4 h-8 flex items-center justify-center gap-2">
                <span>Passionate</span>
                <span
                  key={roleIndex}
                  className="font-display italic text-text-primary text-2xl animate-role-fade-in inline-block"
                >
                  {ROLES[roleIndex]}
                </span>
                <span>focused on building clear systems.</span>
              </div>

              <p className="blur-in text-sm md:text-base text-muted max-w-lg mb-10 leading-relaxed font-light">
                I build clean Excel dashboards, organize and analyze data, and put together robust programming and web projects. Currently open to freelance tasks and learning collaborations.
              </p>

              <div className="blur-in inline-flex items-center gap-4">
                <a
                  href="#projects"
                  className="group relative rounded-full text-sm px-7 py-3.5 bg-text-primary text-bg font-medium transition-all duration-300 hover:scale-105 hover:bg-bg hover:text-text-primary accent-gradient-border"
                >
                  View My Work
                </a>
                <a
                  href="#contact"
                  className="group relative rounded-full text-sm px-7 py-3.5 border-2 border-stroke bg-bg text-text-primary font-medium transition-all duration-300 hover:scale-105 hover:border-transparent accent-gradient-border"
                >
                  Reach out...
                </a>
              </div>
            </div>

            <div className="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center gap-3 pointer-events-none">
              <span className="text-[10px] text-muted uppercase tracking-[0.25em]">
                Scroll
              </span>
              <div className="w-px h-10 bg-stroke relative overflow-hidden">
                <div className="w-full h-1/2 bg-text-primary animate-scroll-down" />
              </div>
            </div>
          </section>

          {/* About Me Section */}
          <section id="about" className="bg-bg py-20 md:py-28 border-t border-stroke">
            <div className="max-w-[1200px] mx-auto px-6 md:px-10 lg:px-16">
              <div className="grid grid-cols-1 md:grid-cols-12 gap-10 items-center">
                <div className="md:col-span-5">
                  <div className="flex items-center gap-3 mb-3">
                    <div className="w-8 h-px bg-stroke" />
                    <span className="text-xs text-muted uppercase tracking-[0.3em]">
                      Background
                    </span>
                  </div>
                  <h2 className="text-4xl md:text-6xl font-normal tracking-tight">
                    About <span className="font-display italic">myself</span>
                  </h2>
                </div>

                <div className="md:col-span-7 bg-surface/50 border border-stroke rounded-3xl p-8 md:p-10 backdrop-blur-sm">
                  <p className="text-base md:text-lg leading-relaxed text-text-primary/90 font-light">
                    I'm a first-year BCA student, building a strong foundation in data science, cybersecurity, and programming. I enjoy turning raw, messy information into something clear and useful — that's what most of the projects below are about.
                  </p>
                  <div className="mt-6 flex flex-wrap gap-4 text-xs font-mono text-muted">
                    <span className="px-3 py-1.5 rounded-md bg-bg border border-stroke">✦ First-Year BCA</span>
                    <span className="px-3 py-1.5 rounded-md bg-bg border border-stroke">✦ Data Science Aspirant</span>
                    <span className="px-3 py-1.5 rounded-md bg-bg border border-stroke">✦ Cyber Defense Fundamentals</span>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Featured Projects Section */}
          <section id="projects" className="bg-bg py-16 md:py-24">
            <div className="max-w-[1200px] mx-auto px-6 md:px-10 lg:px-16">
              <motion.div
                initial={{ opacity: 0, y: 30 }}
                whileInView={{ opacity: 1, y: 0 }}
                viewport={{ once: true, margin: "-100px" }}
                transition={{ duration: 1, ease: [0.25, 0.1, 0.25, 1] }}
                className="flex items-end justify-between mb-16"
              >
                <div>
                  <div className="flex items-center gap-3 mb-3">
                    <div className="w-8 h-px bg-stroke" />
                    <span className="text-xs text-muted uppercase tracking-[0.3em]">
                      Portfolio Works
                    </span>
                  </div>
                  <h2 className="text-3xl md:text-5xl font-normal">
                    Featured <span className="font-display italic">projects</span>
                  </h2>
                  <p className="text-muted text-sm md:text-base mt-2 max-w-md">
                    Structured dashboards, computational tools, and data-driven systems designed for clarity.
                  </p>
                </div>

                <a
                  href="#contact"
                  className="hidden md:inline-flex items-center gap-2 rounded-full p-[1.5px] group text-sm"
                >
                  <span className="accent-gradient-border rounded-full px-5 py-2.5 bg-surface text-text-primary">
                    Inquire Files →
                  </span>
                </a>
              </motion.div>

              {/* Bento Grid: 6 Projects */}
